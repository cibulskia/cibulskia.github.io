<!DOCTYPE html>
<html>
<head>
    <title>Demo Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button, input {
            padding: 5px 10px;
            margin: 2px;
        }
        #submitButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .row {
            display: flex;
            margin-bottom: 5px;
        }
        .row .input-group {
            margin-right: 5px;
        }
        .row .input-group:last-child {
            margin-right: 0;
        }

        <div class="row">

            <div class="input-group"><input type="text"></div>
