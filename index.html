<!DOCTYPE html>
<html>
<head>
    <title>GitHub Hosted App</title>
    <style>
        /* Osnovni stilovi */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        #submitButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Raspored elemenata */
        body {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Google dugme na vrhu */
        #googleLoginButton {
            margin-bottom: 10px;
        }

        /* Dugme Pošalji odmah ispod */
        #submitButton {
            margin-bottom: 15px;
        }

        /* Pet polja u jednom redu */
        #inputFieldsContainer {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        #inputFieldsContainer .input-group {
            flex: 0 0 calc(20% - 10px); /* 5 polja po redu sa razmakom */
            margin-right: 10px;
        }

        #inputFieldsContainer .input-group:nth-child(5n) {
            margin-right: 0;
        }

        /* Sedam redova po 6 polja - koristi dodatni div u JS ili HTML */
        #gridContainer {
            display: flex;
            flex-wrap: wrap;
        }

        #gridContainer .input-group {
            flex: 0 0 calc(16.666% - 10px); /* 6 polja po redu sa razmakom */
            margin-right: 10px;
            margin-bottom: 5px;
        }

        #gridContainer .input-group:nth-child(6n) {
            margin-right: 0;
        }
    </style>
</head>
<body>
    <!-- Google dugme na vrhu -->
    <div id="googleLoginButton"></div>

    <!-- Dugme Pošalji -->
    <button id="submitButton" disabled>Pošalji</button>

    <!-- Pet polja u jednom redu -->
    <div id="inputFieldsContainer">
        <div class="input-group"><input type="text" placeholder="Polje 1"></div>
        <div class="input-group"><input type="text" placeholder="Polje 2"></div>
        <div class="input-group"><input type="text" placeholder="Polje 3"></div>
        <div class="input-group"><input type="text" placeholder="Polje 4"></div>
        <div class="input-group"><input type="text" placeholder="Polje 5"></div>
    </div>

    <!-- Sedam redova po 6 polja -->
    <div id="gridContainer">
        <!-- Primer: 7*6=42 polja -->
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>

        <div class="input-group"><input type="text"></div>
        <div class="input-group"><input type="text"></div>

    <script src="script.js"></script>

</body>
</html>
