<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistička Aplikacija</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #0056b3; }
        .user-info, .settings-section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #e9f7ff; }
        .user-info p, .settings-section p { margin: 5px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea, select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="checkbox"] { margin-right: 5px; }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .response-area {
            background-color: #f0f0f0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 50px;
            white-space: pre-wrap;
            font-size: 0.9em;
        }
        .error-message { color: red; font-weight: bold; }
        .success-message { color: green; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Moja Minimalistička Aplikacija</h1>

        <!-- Google One Tap / Sign-in div -->
        <div id="g_id_onload"
             data-client_id="252373158568-4up41b7jo8ik6cu8c1pl3mlvvck2sq2t.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_select="true"
             data-itp_support="true">
        </div>
        <div class="g_id_signin" data-type="standard"></div>

        <div class="user-info hidden" id="userInfoDisplay">
            <h2>Prijavljeni Korisnik</h2>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Ime:</strong> <span id="userName"></span></p>
            <p><strong>Google ID:</strong> <span id="googleUserId"></span></p>
            <button onclick="signOut()">Odjavi se</button>
        </div>

        <div class="settings-section hidden" id="mainAppSection">
            <h2>Korisnička Podešavanja</h2>
            <form id="userSettingsForm">
                <label for="settingsGoogleUserId">Google User ID (Automatski):</label>
                <input type="text" id="settingsGoogleUserId" name="google_user_id" readonly>

                <label for="settingsClientEmail">Email Klijenta (Automatski):</label>
                <input type="text" id="settingsClientEmail" name="client_email" readonly>

                <label for="discordToken">Discord Token:</label>
                <input type="text" id="discordToken" name="discord_token" placeholder="Unesite Discord Token">

                <label>
                    <input type="checkbox" id="isCheckboxChecked" name="is_checkbox_checked">
                    Čekboks je štikliran
                </label>
                <br>
                <label for="generalResponse">Opšti Odgovor:</label>
                <textarea id="generalResponse" name="general_response" rows="3" placeholder="Unesite opšti odgovor"></textarea>

                <label for="userRule">Pravilo Korisnika:</label>
                <select id="userRule" name="user_rule">
                    <option value="">Izaberite Pravilo</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
                <button type="submit">Sačuvaj Podešavanja</button>
                <button type="button" onclick="getUserSettings()">Učitaj Podešavanja</button>
            </form>
            <div id="userSettingsResponse" class="response-area"></div>

            <h2>Kategorije</h2>
            <form id="categoryForm">
                <label for="categoryGoogleUserId">Google User ID (Automatski):</label>
                <input type="text" id="categoryGoogleUserId" name="google_user_id" readonly>

                <label for="categoryClientEmail">Email Klijenta (Automatski):</label>
                <input type="text" id="categoryClientEmail" name="client_email" readonly>

                <label for="sequenceNumber">Redni Broj (1-99):</label>
                <input type="number" id="sequenceNumber" name="sequence_number" min="1" max="99" value="1" required>

                <label for="priority">Prioritet (0-9):</label>
                <input type="number" id="priority" name="priority" min="0" max="9" value="5" required>

                <label for="rule">Pravilo (A, B, C):</label>
                <select id="rule" name="rule" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>

                <label for="response">Odgovor:</label>
                <textarea id="response" name="response" rows="3" placeholder="Unesite odgovor" required></textarea>

                <label for="tags">Tagovi (odvojeni zarezom):</label>
                <input type="text" id="tags" name="tags" placeholder="tag1, tag2, tag3" required>

                <button type="submit">Sačuvaj Kategoriju</button>
                <button type="button" onclick="getCategories()">Učitaj Kategorije</button>
            </form>
            <div id="categoryResponse" class="response-area"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://botanica.ngrok.app'; // Prilagodite ako se backend pokreće na drugom portu/hostu

        let currentUser = {
            id: null,
            email: null,
            name: null
        };

        // Google OAuth Callback Handler
        function handleCredentialResponse(response) {
            console.log("Google token received:", response.credential);
            fetch(`${BACKEND_URL}/oauth_callback`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ credential: response.credential }),
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    currentUser.id = data.user_id;
                    currentUser.email = data.user_email;
                    currentUser.name = data.user_name;
                    updateUI();
                    console.log("Korisnik prijavljen:", currentUser);

                    // Automatski dohvati postojeća podešavanja korisnika i kategorije
                    getUserSettings();
                    getCategories();

                } else {
                    console.error("Greška pri Google prijavi:", data.message);
                    alert("Greška pri prijavi: " + data.message);
                }
            })
            .catch(error => {
                console.error('Greška pri komunikaciji sa backendom:', error);
                alert("Greška pri komunikaciji sa serverom.");
            });
        }

        // Ažurira UI na osnovu prijavljenog korisnika
        function updateUI() {
            const userInfoDisplay = document.getElementById('userInfoDisplay');
            const mainAppSection = document.getElementById('mainAppSection');
            const gIdSignIn = document.querySelector('.g_id_signin');

            if (currentUser.id) {
                document.getElementById('userEmail').textContent = currentUser.email;
                document.getElementById('userName').textContent = currentUser.name;
                document.getElementById('googleUserId').textContent = currentUser.id;
                userInfoDisplay.classList.remove('hidden');
                mainAppSection.classList.remove('hidden');
                if (gIdSignIn) gIdSignIn.classList.add('hidden'); // Sakrij Google dugme

                // Automatski popuni Google ID i Email u obe forme
                document.getElementById('settingsGoogleUserId').value = currentUser.id;
                document.getElementById('settingsClientEmail').value = currentUser.email;
                document.getElementById('categoryGoogleUserId').value = currentUser.id;
                document.getElementById('categoryClientEmail').value = currentUser.email;
            } else {
                userInfoDisplay.classList.add('hidden');
                mainAppSection.classList.add('hidden');
                if (gIdSignIn) gIdSignIn.classList.remove('hidden'); // Prikaži Google dugme
            }
        }

        // Odjava korisnika
        function signOut() {
            // Google odjava - briše sesiju u pregledaču
            google.accounts.id.disableAutoSelect(); // Isključi automatsku prijavu
            google.accounts.id.revoke(currentUser.email, done => {
                console.log('Google odjava kompletna:', done);
                currentUser.id = null;
                currentUser.email = null;
                currentUser.name = null;
                updateUI();
                alert("Uspešno ste se odjavili.");
                // Resetovanje formi
                document.getElementById('userSettingsForm').reset();
                document.getElementById('categoryForm').reset();
                document.getElementById('userSettingsResponse').textContent = '';
                document.getElementById('categoryResponse').textContent = '';
            });
        }

        // Sačuvaj korisnička podešavanja
        document.getElementById('userSettingsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentUser.id) {
                alert('Molimo prijavite se prvo.');
                return;
            }

            const discordToken = document.getElementById('discordToken').value;
            const isCheckboxChecked = document.getElementById('isCheckboxChecked').checked;
            const generalResponse = document.getElementById('generalResponse').value;
            const userRule = document.getElementById('userRule').value;

            const postData = {
                google_user_id: currentUser.id,
                client_email: currentUser.email, // Saljemo email, iako backend moze popuniti
                discord_token: discordToken || null, // Salji null ako je prazno
                is_checkbox_checked: isCheckboxChecked,
                general_response: generalResponse || null,
                user_rule: userRule || null
            };

            fetch(`${BACKEND_URL}/user_settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData),
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('userSettingsResponse').textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error('Greška pri čuvanju podešavanja:', error);
                document.getElementById('userSettingsResponse').textContent = 'Greška: ' + error.message;
            });
        });

        // Dohvati korisnička podešavanja
        function getUserSettings() {
            if (!currentUser.id) return;

            fetch(`${BACKEND_URL}/get_user_settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ google_user_id: currentUser.id }),
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.user_settings) {
                    const settings = data.user_settings;
                    document.getElementById('discordToken').value = settings.discord_token || '';
                    document.getElementById('isCheckboxChecked').checked = settings.is_checkbox_checked || false;
                    document.getElementById('generalResponse').value = settings.general_response || '';
                    document.getElementById('userRule').value = settings.user_rule || '';
                    document.getElementById('userSettingsResponse').textContent = 'Podešavanja učitana.';
                } else {
                    document.getElementById('userSettingsResponse').textContent = data.message || 'Nema sačuvanih podešavanja.';
                    // Ako nema podešavanja, resetuj formu na podrazumevane vrednosti ili prazno
                    document.getElementById('userSettingsForm').reset();
                    document.getElementById('isCheckboxChecked').checked = false;
                    // Ponovo popuni automatska polja
                    document.getElementById('settingsGoogleUserId').value = currentUser.id;
                    document.getElementById('settingsClientEmail').value = currentUser.email;
                }
            })
            .catch(error => {
                console.error('Greška pri dohvatanju podešavanja:', error);
                document.getElementById('userSettingsResponse').textContent = 'Greška: ' + error.message;
            });
        }

        // Sačuvaj kategoriju
        document.getElementById('categoryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentUser.id) {
                alert('Molimo prijavite se prvo.');
                return;
            }

            const sequenceNumber = document.getElementById('sequenceNumber').value;
            const priority = document.getElementById('priority').value;
            const rule = document.getElementById('rule').value;
            const response = document.getElementById('response').value;
            const tagsInput = document.getElementById('tags').value;
            const tags = tagsInput ? tagsInput.split(',').map(tag => tag.trim()) : [];

            const postData = {
                google_user_id: currentUser.id,
                client_email: currentUser.email, // Saljemo email, iako backend moze popuniti
                sequence_number: parseInt(sequenceNumber),
                priority: parseInt(priority),
                rule: rule,
                response: response,
                tags: tags
            };

            fetch(`${BACKEND_URL}/categories`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData),
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('categoryResponse').textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error('Greška pri čuvanju kategorije:', error);
                document.getElementById('categoryResponse').textContent = 'Greška: ' + error.message;
            });
        });

        // Dohvati kategorije
        function getCategories() {
            if (!currentUser.id) return;

            fetch(`${BACKEND_URL}/get_categories`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ google_user_id: currentUser.id }),
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.categories.length > 0) {
                    const categoriesHtml = data.categories.map(cat => `
                        <div>
                            <strong>Email:</strong> ${cat.client_email}<br>
                            <strong>Seq:</strong> ${cat.sequence_number},
                            <strong>Pri:</strong> ${cat.priority},
                            <strong>Rule:</strong> ${cat.rule}<br>
                            <strong>Resp:</strong> ${cat.response}<br>
                            <strong>Tags:</strong> ${cat.tags.join(', ')}
                        </div><hr>
                    `).join('');
                    document.getElementById('categoryResponse').innerHTML = "<h3>Učitane Kategorije:</h3>" + categoriesHtml;
                } else {
                    document.getElementById('categoryResponse').textContent = data.message || 'Nema sačuvanih kategorija.';
                }
            })
            .catch(error => {
                console.error('Greška pri dohvatanju kategorija:', error);
                document.getElementById('categoryResponse').textContent = 'Greška: ' + error.message;
            });
        }

        // Inicijalizacija UI-a
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
