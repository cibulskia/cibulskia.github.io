<!DOCTYPE html>
<html>
<head>
    <title>GitHub Hosted App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            gap: 10px; /* Razmak između polja u redu */
            margin-bottom: 10px;
        }
        .row input {
            flex: 1; /* Omogućava da se polja rastežu i skupljaju */
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #submitButton {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 20px; /* Dodato malo margina ispod dugmeta */
        }
        #submitButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #googleLoginButton {
            margin-bottom: 20px; /* Razmak između Google dugmeta i ostalih elemenata */
            /* Stil za centriranje Google dugmeta ako je potrebno */
            display: flex;
            justify-content: center;
        }
        #responseArea {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #eee;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div id="googleLoginButton"></div>

    <button id="submitButton" disabled>Pošalji</button>

    <!-- Prvi red sa 5 polja -->
    <div class="row" id="firstRowInputFields">

        <div class="row">

        <div class="row">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js"></script>

</html>
