<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Chat Widget</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #qaPopup {
            position: fixed; bottom: 20px; right: 20px;
            width: 100%; max-width: 400px;
            border-radius: 10px; background: #f9f9f9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ccc; display: flex; flex-direction: column;
            z-index: 1006; overflow: hidden;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #qaPopup.active {
            transform: translateY(0);
            opacity: 1;
        }
        #chatHistory {
            padding: 10px; max-height: 50vh; overflow-y: auto; font-size: 0.95em;
            flex-grow: 1; /* Omogućava da chatHistory zauzme raspoloživi prostor */
        }
        .chat-message { margin-bottom: 10px; word-wrap: break-word; }
        .chat-message.user {
            text-align: right;
            color: white;
            background-color: #007BFF;
            padding: 8px 12px;
            border-radius: 15px;
            margin-left: auto; /* Pomera poruku skroz desno */
            max-width: 80%;
            width: fit-content;
        }
        .chat-message.bot {
            text-align: left;
            color: #333333;
            background-color: #e2e2e2;
            padding: 8px 12px;
            border-radius: 15px;
            margin-right: auto; /* Pomera poruku skroz levo */
            max-width: 80%;
            width: fit-content;
        }
        #qaPopup textarea {
            padding: 10px;
            width: calc(100% - 20px);
            font-size: 1em;
            margin: 10px;
            display: block;
            resize: none;
            min-height: 40px;
            overflow: hidden;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #chatControls {
            display: flex; justify-content: flex-end; gap: 10px; margin: 0 10px 10px 10px;
        }
        #chatControls button {
            padding: 10px 15px; font-size: 1em; cursor: pointer; border-radius: 5px; border: none;
            transition: background-color 0.2s ease;
        }
        #sendBtn { background-color: #007BFF; color: white; }
        #sendBtn:hover { background-color: #0056b3; }
        #closeChatBtn { background-color: #dc3545; color: white; }
        #closeChatBtn:hover { background-color: #c82333; }
        #openChatBtn {
            position: fixed; bottom: 20px; right: 20px; z-index:1005;
            padding: 15px 25px; font-size: 1.2em; cursor: pointer;
            border-radius: 50px; border: none; background-color: #007BFF; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        #openChatBtn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Dodato za animaciju loading poruke */
        .chat-message.bot.loading::after {
            content: '...';
            animation: blink 1s infinite steps(1, start);
        }
        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media screen and (max-width:768px) {
            #qaPopup { width:90%; right:5%; bottom:10px; max-width:none; }
            #qaPopup textarea { width: calc(100% - 20px); }
            #openChatBtn { padding: 12px 20px; font-size: 1em; }
        }
    </style>
</head>
<body style="margin:0; padding:0;">

    <button id="openChatBtn">Chat</button>

    <div id="qaPopup">
        <div id="chatHistory"></div>
        <textarea id="userQuestion" placeholder="Postavi pitanje..."></textarea>
        <div id="chatControls">
            <button id="closeChatBtn">Zatvori</button>
            <button id="sendBtn">Pošalji</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const SERVER_URL = "https://botanica.ngrok.app"; // Tvoj ngrok URL

            const openChatBtn = document.getElementById("openChatBtn");
            const qaPopup = document.getElementById("qaPopup");
            const chatHistory = document.getElementById("chatHistory");
            const sendBtn = document.getElementById("sendBtn");
            const closeChatBtn = document.getElementById("closeChatBtn");
            const userQuestion = document.getElementById("userQuestion");

            let visitorId = localStorage.getItem("visitor_id");
            if (!visitorId) {
                visitorId = "user_" + Math.random().toString(36).substring(2, 10);
                localStorage.setItem("visitor_id", visitorId);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const site = urlParams.get('site') || 'unknown_site';

            // Kreiramo fullId format koji očekuje server: (site)visitor_id
            const fullId = `(${site})${visitorId}`;

            let pollingInterval = null;
            let currentBotMessageElement = null; // Referenca na loading poruku bota

            function appendMessage(sender, text, isPending = false) {
                const div = document.createElement("div");
                div.className = `chat-message ${sender}`;
                div.textContent = text;
                if (isPending) {
                    div.classList.add("loading");
                    currentBotMessageElement = div; // Sačuvaj referencu na loading poruku
                }
                chatHistory.appendChild(div);
                chatHistory.scrollTop = chatHistory.scrollHeight;
                return div; // Vrati element za dalju manipulaciju
            }

            function updateBotMessage(text) {
                if (currentBotMessageElement) {
                    currentBotMessageElement.textContent = text;
                    currentBotMessageElement.classList.remove("loading");
                    currentBotMessageElement = null;
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }
            }

            userQuestion.addEventListener('input', e => {
                e.target.style.height = 'auto';
                e.target.style.height = (e.target.scrollHeight) + 'px';
            });

            async function sendQuestion() {
                const question = userQuestion.value.trim();
                if(!question) return;

                appendMessage("user", question);
                userQuestion.value = '';
                userQuestion.style.height = 'auto';
                sendBtn.disabled = true; // Onemogući dugme dok se ne dobije odgovor
                userQuestion.disabled = true; // Onemogući textarea

                appendMessage("bot", "...", true); // Dodaj loading poruku

                try {
                    const timestamp = new Date().getTime();
                    const response = await fetch(`${SERVER_URL}/ask?id=${encodeURIComponent(fullId)}&question=${encodeURIComponent(question)}&_t=${timestamp}`, {
                        headers: { "ngrok-skip-browser-warning": "true" }
                    });
                    const data = await response.json();
                    if (!response.ok || data.status === "error") {
                        updateBotMessage(`Greška: ${data.message || 'Nepoznata greška'}`);
                        sendBtn.disabled = false;
                        userQuestion.disabled = false;
                    } else {
                        // Ako je pitanje uspešno poslato, počinjemo sa pollingom
                        startPolling();
                    }
                } catch (err) {
                    updateBotMessage("Greška u komunikaciji sa serverom.");
                    console.error("Greška pri slanju pitanja:", err);
                    sendBtn.disabled = false;
                    userQuestion.disabled = false;
                }
            }

            async function pollForAnswer() {
                try {
                    const timestamp = new Date().getTime();
                    const response = await fetch(`${SERVER_URL}/check_answer?id=${encodeURIComponent(fullId)}&_t=${timestamp}`, {
                        headers: { "ngrok-skip-browser-warning": "true" }
                    });
                    const data = await response.json();

                    if (response.ok && data.status === "success") {
                        stopPolling();
                        updateBotMessage(data.answer); // Ažuriraj loading poruku stvarnim odgovorom
                        sendBtn.disabled = false; // Ponovo omogući dugme
                        userQuestion.disabled = false; // Ponovo omogući textarea
                    } else if (data.status === "pending") {
                        // Odgovor još nije spreman, nastavi polling
                    } else if (data.status === "error") {
                        stopPolling();
                        updateBotMessage(`Greška: ${data.answer || data.message || 'Nepoznata greška.'}`);
                        sendBtn.disabled = false;
                        userQuestion.disabled = false;
                    }
                } catch (err) {
                    console.error("Polling greška:", err);
                    // Ne zaustavljamo polling ovde, jer može biti privremena greška
                }
            }

            function startPolling() {
                if (!pollingInterval) {
                    pollingInterval = setInterval(pollForAnswer, 3000); // Polling svakih 3 sekunde
                }
            }

            function stopPolling() {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }

            function openChat() {
                qaPopup.classList.add("active");
                // Kada se chat otvori, proverimo da li imamo pending odgovor i pokrenemo polling ako je potrebno
                if (sendBtn.disabled) { // Ako je dugme onemogućeno, znači da čekamo odgovor
                    startPolling();
                }
            }

            function closeChat() {
                qaPopup.classList.remove("active");
                stopPolling(); // Zaustavi polling kada se chat zatvori
            }

            openChatBtn.addEventListener("click", () => {
                if (qaPopup.classList.contains("active")) {
                    closeChat();
                } else {
                    openChat();
                }
            });

            closeChatBtn.addEventListener("click", closeChat);
            sendBtn.addEventListener("click", sendQuestion);
            userQuestion.addEventListener("keydown", e => {
                if(e.key === "Enter" && !e.shiftKey){
                    e.preventDefault();
                    sendQuestion();
                }
            });
        });
    </script>

</body>
</html>
