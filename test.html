<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stranica sa sidebarom</title>
<style>
body { margin:0; font-family: Arial, sans-serif; overflow-x:hidden; }

/* Sidebar */
#sidebar {
  position: fixed;
  top:0; left:0;
  width:250px; height:100%;
  background:#fff; color:#333;
  padding-top:60px; padding-left:10px;
  overflow-y:auto;
  transition: transform 0.3s ease;
  z-index:1002;
}
#sidebar a {
  display:block; padding:15px 20px; text-decoration:none; color:#333;
  font-size:1.2em; font-weight:700;
}
#sidebar a:hover { background:#eee; }

/* Main content */
#main {
  transition: margin-left 0.3s ease;
  margin-left:250px;
  padding:20px;
}

/* Desktop toggle */
body.desktop-closed #sidebar { transform: translateX(-250px); }
body.desktop-closed #main { margin-left:0; }

/* Overlay for mobile */
#overlay {
  display:none;
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.4);
  z-index:1001;
}

/* Toggle button */
#toggleBtn {
  position:fixed; top:15px; left:15px; font-size:24px;
  background:none; border:none; z-index:1005; cursor:pointer;
}

/* Scroll to top button */
#topBtn {
  display:none; position:fixed; top:20px; right:30px; z-index:1004;
  font-size:16px; padding:10px 15px; background-color:#888; color:white;
  border:none; border-radius:5px; cursor:pointer; transition:background-color 0.3s;
}
#topBtn:hover { background-color:#007BFF; }

/* Mobile styles */
@media(max-width:768px){
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left:0; }
  #overlay.show { display:block; }
}
</style>
</head>
<body>

<div id="sidebar"></div>
<div id="overlay"></div>

<div id="main">
  <button id="toggleBtn">☰</button>
  <div id="sections"></div>
</div>

<button id="topBtn" onclick="scrollToTop()">Botanica</button>

<script>
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
const toggleBtn = document.getElementById('toggleBtn');
const overlay = document.getElementById('overlay');
const body = document.body;
const sectionsContainer = document.getElementById('sections');

// Toggle sidebar
function openMobileSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeMobileSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
toggleBtn.addEventListener('click', ()=>{
  if(window.innerWidth <= 768){
    openMobileSidebar();
  } else {
    body.classList.toggle('desktop-closed');
  }
});
overlay.addEventListener('click', closeMobileSidebar);

// Scroll to top button
const topBtn = document.getElementById("topBtn");
window.onscroll = () => topBtn.style.display = (document.documentElement.scrollTop > 200) ? "block" : "none";
function scrollToTop(){ window.scrollTo({top:0, behavior:"smooth"}); }

// Initial sidebar state
function setSidebarState(){
  if(window.innerWidth > 768){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    body.classList.remove('desktop-closed');
  } else {
    sidebar.classList.remove('open'); // mobile sidebar zatvoren po defaultu
    overlay.classList.remove('show');
    body.classList.remove('desktop-closed');
  }
}
window.addEventListener('load', setSidebarState);
window.addEventListener('resize', setSidebarState);

// Klik na link zatvara sidebar na mobilnom
function attachLinkHandler(link){
  link.addEventListener('click', e=>{
    e.preventDefault();
    const targetId = link.getAttribute('href').replace('#','');
    const sec = document.getElementById(targetId);
    if(sec) sec.scrollIntoView({behavior:"smooth"});
    if(window.innerWidth <= 768) closeMobileSidebar();
  });
}

// Učitavanje sekcija sa JSON fajla
fetch("content.json")
  .then(res => res.ok ? res.json() : Promise.reject("Greška u učitavanju JSON-a"))
  .then(data=>{
    sidebar.innerHTML = "";
    sectionsContainer.innerHTML = "";
    let i=0;
    for(let key in data){
      i++;
      const item = data[key];
      // link u sidebar
      const link = document.createElement('a');
      link.href = '#'+key;
      link.textContent = item.title;
      attachLinkHandler(link);
      sidebar.appendChild(link);
      // sekcija
      const section = document.createElement('section');
      section.id = key;
      section.style.backgroundColor = item.bgColor || (i%2===0?"#F5F5F5":"#FFFFFF");
      section.style.color="#333";
      section.innerHTML = item.content || "";
      sectionsContainer.appendChild(section);
    }
    // Hardkodirani manager link
    const managerLink = document.createElement('a');
    managerLink.href="manager";
    managerLink.textContent="Manager";
    sidebar.appendChild(managerLink);
    attachLinkHandler(managerLink);
  })
  .catch(err=>console.error(err));
</script>

<!-- Chat widget iframe -->
<iframe 
  src="https://cibulskia.github.io/bot/chat_widget?site=botanica"  
  style="position: fixed; bottom: 0; right: 0; width: 100%; max-width: 400px; height: 600px; border: none; z-index: 9999;"
  scrolling="no">
</iframe>

</body>
</html>
