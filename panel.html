<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Botanica Demo</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, select, button, textarea { margin: 5px 0; width: 100%; }
    fieldset { margin-bottom: 15px; }
</style>
</head>
<body>
<h2>Botanica Demo</h2>

<div id="login-section">
    <div id="g_id_onload"
         data-client_id="252373158568-4up41b7jo8ik6cu8c1pl3mlvvck2sq2t.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
</div>

<div id="main-section" style="display:none;">
    <p>Prijavljen korisnik: <span id="user-email"></span></p>

    <fieldset>
        <legend>Kategorija</legend>
        <input type="number" id="seq-num" placeholder="Sequence Number (1-99)">
        <input type="number" id="priority" placeholder="Priority (0-9)">
        <select id="rule">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
        </select>
        <textarea id="response" placeholder="Response"></textarea>
        <input type="text" id="tags" placeholder='Tags (comma separated)'>
        <button onclick="saveCategory()">Sačuvaj kategoriju</button>
        <button onclick="fetchCategories()">Dohvati kategorije</button>
        <pre id="categories-output"></pre>
    </fieldset>

    <fieldset>
        <legend>Korisnička podešavanja</legend>
        <input type="text" id="discord-token" placeholder="Discord Token">
        <label>
            <input type="checkbox" id="is-checkbox"> Is Checkbox Checked
        </label>
        <textarea id="general-response" placeholder="General Response"></textarea>
        <select id="user-rule">
            <option value="">--Izaberi rule--</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>
        <input type="text" id="user-client-email" placeholder="Client Email (optional)">
        <button onclick="saveUserSettings()">Sačuvaj podešavanja</button>
        <button onclick="fetchUserSettings()">Dohvati podešavanja</button>
        <pre id="user-settings-output"></pre>
    </fieldset>
</div>

<script>
let currentUserId = null;
let currentUserEmail = null;

function handleCredentialResponse(response) {
    fetch('https://botanica.ngrok.app/oauth_callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            currentUserId = data.user_id;
            currentUserEmail = data.user_email;
            document.getElementById('user-email').textContent = currentUserEmail;
            document.getElementById('main-section').style.display = 'block';
            document.getElementById('login-section').style.display = 'none';
        } else {
            alert(data.message);
        }
    });
}

function saveCategory() {
    const seq = parseInt(document.getElementById('seq-num').value);
    const prio = parseInt(document.getElementById('priority').value);
    const rule = document.getElementById('rule').value;
    const resp = document.getElementById('response').value;
    const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t=>t);

    fetch('https://botanica.ngrok.app/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            google_user_id: currentUserId,
            client_email: currentUserEmail,
            sequence_number: seq,
            priority: prio,
            rule: rule,
            response: resp,
            tags: tags
        })
    })
    .then(res => res.json())
    .then(data => alert(data.message));
}

function fetchCategories() {
    fetch('https://botanica.ngrok.app/get_categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ google_user_id: currentUserId })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('categories-output').textContent = JSON.stringify(data.categories, null, 2);
    });
}

function saveUserSettings() {
    const discord = document.getElementById('discord-token').value;
    const checkbox = document.getElementById('is-checkbox').checked;
    const genResp = document.getElementById('general-response').value;
    const userRule = document.getElementById('user-rule').value || null;
    const email = document.getElementById('user-client-email').value || null;

    fetch('https://botanica.ngrok.app/user_settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            google_user_id: currentUserId,
            discord_token: discord,
            is_checkbox_checked: checkbox,
            general_response: genResp,
            user_rule: userRule,
            client_email: email
        })
    })
    .then(res => res.json())
    .then(data => alert(data.message));
}

function fetchUserSettings() {
    fetch('https://botanica.ngrok.app/get_user_settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ google_user_id: currentUserId })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('user-settings-output').textContent = JSON.stringify(data.user_settings, null, 2);
        if (data.user_settings) {
            document.getElementById('discord-token').value = data.user_settings.discord_token || '';
            document.getElementById('is-checkbox').checked = data.user_settings.is_checkbox_checked || false;
            document.getElementById('general-response').value = data.user_settings.general_response || '';
            document.getElementById('user-rule').value = data.user_settings.user_rule || '';
            document.getElementById('user-client-email').value = data.user_settings.client_email || '';
        }
    });
}
</script>
</body>
</html>
