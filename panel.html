<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Frontend</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { max-width: 800px; margin: auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #0056b3; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea, select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="checkbox"] { margin-right: 5px; }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 5px;
            margin-right: 10px;
        }
        button:hover { background-color: #0056b3; }
        #google-sign-in-button { width: 100%; margin-bottom: 20px; }
        #user-info, #response-log, #categories-display, #user-settings-display {
            background-color: #e2e2e2;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap; /* Omogućava prelom teksta */
            word-wrap: break-word; /* Omogućava prelom dugih reči */
            overflow-x: auto; /* Horizontalni scroll za duge linije */
            max-height: 200px;
            overflow-y: auto;
        }
        .logged-out { display: none; }
        .logged-in { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minimalistički Frontend za Backend</h1>

        <div id="logged-out-view" class="logged-out">
            <h2>Prijava</h2>
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left"
                 id="google-sign-in-button">
            </div>
        </div>

        <div id="logged-in-view" class="logged-in">
            <h2>Korisničke Informacije</h2>
            <div id="user-info">
                Niste prijavljeni.
            </div>
            <button onclick="logout()">Odjavi se</button>

            <hr style="margin: 20px 0;">

            <div class="section">
                <h2>Dodaj/Ažuriraj Kategoriju</h2>
                <form id="category-form">
                    <label for="cat-sequence">Redni broj (1-99):</label>
                    <input type="number" id="cat-sequence" min="1" max="99" required><br>
                    <label for="cat-priority">Prioritet (0-9):</label>
                    <input type="number" id="cat-priority" min="0" max="9" required><br>
                    <label for="cat-rule">Pravilo (A, B, C):</label>
                    <select id="cat-rule" required>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select><br>
                    <label for="cat-response">Odgovor:</label>
                    <textarea id="cat-response" required></textarea><br>
                    <label for="cat-tags">Tagovi (JSON lista, npr. ["tag1", "tag2"]):</label>
                    <input type="text" id="cat-tags" placeholder='["tag1", "tag2"]' required><br>
                    <button type="submit">Sačuvaj Kategoriju</button>
                </form>
                <button onclick="fetchCategories()">Dohvati Sve Kategorije</button>
                <h3>Trenutne Kategorije:</h3>
                <div id="categories-display"></div>
            </div>

            <hr style="margin: 20px 0;">

            <div class="section">
                <h2>Korisnička Podešavanja</h2>
                <form id="settings-form">
                    <label for="discord-token">Discord Token:</label>
                    <input type="text" id="discord-token"><br>
                    <label for="is-checkbox-checked">
                        <input type="checkbox" id="is-checkbox-checked"> Da li je čekirano?
                    </label><br>
                    <label for="general-response">Generalni Odgovor:</label>
                    <textarea id="general-response"></textarea><br>
                    <label for="user-rule">Pravilo Korisnika (A, B, C, D):</label>
                    <select id="user-rule">
                        <option value="">Nijedno</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select><br>
                    <button type="submit">Sačuvaj Podešavanja</button>
                </form>
                <button onclick="fetchUserSettings()">Dohvati Podešavanja</button>
                <h3>Trenutna Podešavanja:</h3>
                <div id="user-settings-display"></div>
            </div>
        </div>

        <div class="section">
            <h2>Log</h2>
            <div id="response-log"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://botanica.ngrok.app'; // PRILAGODI AKO JE POTREBNO
        const googleClientId = "252373158568-4up41b7jo8ik6cu8c1pl3mlvvck2sq2t.apps.googleusercontent.com"; // PRILAGODI SA VAŠIM KLIJENT ID-JEM

        let userCredential = null;
        let userInfo = {
            id: null,
            email: null,
            name: null
        };

        const loggedOutView = document.getElementById('logged-out-view');
        const loggedInView = document.getElementById('logged-in-view');
        const userInfoDisplay = document.getElementById('user-info');
        const responseLog = document.getElementById('response-log');
        const categoriesDisplay = document.getElementById('categories-display');
        const userSettingsDisplay = document.getElementById('user-settings-display');

        function updateUI() {
            if (userCredential && userInfo.id) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
                userInfoDisplay.textContent = `Prijavljeni ste kao: ${userInfo.name} (${userInfo.email})\nID: ${userInfo.id}`;
                fetchCategories(); // Automatski dohvati kategorije nakon prijave
                fetchUserSettings(); // Automatski dohvati podešavanja nakon prijave
            } else {
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
                userInfoDisplay.textContent = 'Niste prijavljeni.';
                categoriesDisplay.textContent = '';
                userSettingsDisplay.textContent = '';
            }
        }

        function logResponse(message, type = 'info') {
            const entry = document.createElement('p');
            entry.textContent = `[${new Date().toLocaleTimeString()}] [${type.toUpperCase()}] ${message}`;
            if (type === 'error') {
                entry.style.color = 'red';
            } else if (type === 'success') {
                entry.style.color = 'green';
            }
            responseLog.prepend(entry); // Dodaj na vrh
            if (responseLog.children.length > 50) { // Ograniči broj poruka
                responseLog.removeChild(responseLog.lastChild);
            }
        }

        async function handleCredentialResponse(response) {
            logResponse("Primljen Google credential. Slanje na backend za verifikaciju...");
            const idToken = response.credential;

            try {
                const apiResponse = await fetch(`${API_BASE_URL}/oauth_callback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: idToken })
                });
                const data = await apiResponse.json();

                if (apiResponse.ok) {
                    userCredential = idToken; // Sačuvaj credential za buduće zahteve
                    userInfo.id = data.user_id;
                    userInfo.email = data.user_email;
                    userInfo.name = data.user_name;
                    logResponse(`Prijava uspešna: ${data.user_email}`, 'success');
                    updateUI();
                } else {
                    logResponse(`Greška pri prijavi: ${data.message || 'Nepoznata greška'}`, 'error');
                }
            } catch (error) {
                logResponse(`Greška pri komunikaciji sa backendom za prijavu: ${error.message}`, 'error');
            }
        }

        function logout() {
            userCredential = null;
            userInfo = { id: null, email: null, name: null };
            logResponse("Odjavljeni ste.");
            updateUI();
            // Google ima i 'revoke' opciju ako želite da potpuno opozovete token
        }

        async function sendAuthenticatedRequest(path, method = 'POST', payload = {}) {
            if (!userCredential) {
                logResponse("Morate biti prijavljeni da biste izvršili ovu akciju.", 'error');
                return null;
            }

            const fullPayload = { ...payload, credential: userCredential };

            try {
                const response = await fetch(`${API_BASE_URL}${path}`, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fullPayload)
                });
                const data = await response.json();
                if (!response.ok) {
                    logResponse(`Greška na ruti ${path}: ${data.message || 'Nepoznata greška'}`, 'error');
                    return null;
                }
                return data;
            } catch (error) {
                logResponse(`Greška pri komunikaciji sa backendom na ruti ${path}: ${error.message}`, 'error');
                return null;
            }
        }

        // --- Funkcije za Kategorije ---
        document.getElementById('category-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const sequence_number = document.getElementById('cat-sequence').value;
            const priority = document.getElementById('cat-priority').value;
            const rule = document.getElementById('cat-rule').value;
            const response = document.getElementById('cat-response').value;
            const tagsInput = document.getElementById('cat-tags').value;
            let tags;
            try {
                tags = JSON.parse(tagsInput);
                if (!Array.isArray(tags)) throw new Error("Tags must be a JSON array.");
            } catch (e) {
                logResponse(`Greška u formatu tagova: ${e.message}. Molimo koristite JSON format za niz, npr. ["tag1", "tag2"]`, 'error');
                return;
            }

            logResponse("Slanje kategorije...");
            const result = await sendAuthenticatedRequest('/categories', 'POST', {
                sequence_number: parseInt(sequence_number),
                priority: parseInt(priority),
                rule: rule,
                response: response,
                tags: tags
            });
            if (result) {
                logResponse(result.message, 'success');
                fetchCategories(); // Ažuriraj listu kategorija
            }
        });

        async function fetchCategories() {
            logResponse("Dohvatanje kategorija...");
            const data = await sendAuthenticatedRequest('/get_categories', 'POST', {}); // Prazan payload jer backend uzima iz tokena
            if (data && data.categories) {
                categoriesDisplay.innerHTML = ''; // Očisti prethodni prikaz
                if (data.categories.length === 0) {
                    categoriesDisplay.textContent = 'Nema sačuvanih kategorija za ovog korisnika.';
                } else {
                    data.categories.forEach(cat => {
                        const p = document.createElement('p');
                        p.textContent = `Email: ${cat.client_email}, Seq: ${cat.sequence_number}, Prio: ${cat.priority}, Rule: ${cat.rule}, Resp: "${cat.response}", Tags: ${JSON.stringify(cat.tags)}`;
                        categoriesDisplay.appendChild(p);
                    });
                }
                logResponse("Kategorije uspešno dohvaćene.", 'success');
            } else if (data) {
                categoriesDisplay.textContent = data.message || 'Nema kategorija za prikaz.';
            }
        }

        // --- Funkcije za Korisnička Podešavanja ---
        document.getElementById('settings-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const discord_token = document.getElementById('discord-token').value;
            const is_checkbox_checked = document.getElementById('is-checkbox-checked').checked;
            const general_response = document.getElementById('general-response').value;
            const user_rule = document.getElementById('user-rule').value || null; // Postavi na null ako je prazno

            logResponse("Slanje korisničkih podešavanja...");
            const result = await sendAuthenticatedRequest('/user_settings', 'POST', {
                discord_token: discord_token,
                is_checkbox_checked: is_checkbox_checked,
                general_response: general_response,
                user_rule: user_rule
            });
            if (result) {
                logResponse(result.message, 'success');
                fetchUserSettings(); // Ažuriraj prikaz podešavanja
            }
        });

        async function fetchUserSettings() {
            logResponse("Dohvatanje korisničkih podešavanja...");
            const data = await sendAuthenticatedRequest('/get_user_settings', 'POST', {});
            if (data && data.user_settings) {
                const settings = data.user_settings;
                userSettingsDisplay.innerHTML = '';
                if (settings.discord_token || settings.is_checkbox_checked || settings.general_response || settings.user_rule || settings.client_email) {
                    userSettingsDisplay.innerHTML = `
                        <p><strong>Discord Token:</strong> ${settings.discord_token || 'Nije postavljen'}</p>
                        <p><strong>Čekirano:</strong> ${settings.is_checkbox_checked ? 'Da' : 'Ne'}</p>
                        <p><strong>Generalni Odgovor:</strong> ${settings.general_response || 'Nije postavljen'}</p>
                        <p><strong>Pravilo Korisnika:</strong> ${settings.user_rule || 'Nije postavljeno'}</p>
                        <p><strong>Email (iz baze):</strong> ${settings.client_email || 'Nije postavljen'}</p>
                    `;
                    // Popuni formu sa dohvaćenim podacima
                    document.getElementById('discord-token').value = settings.discord_token || '';
                    document.getElementById('is-checkbox-checked').checked = settings.is_checkbox_checked;
                    document.getElementById('general-response').value = settings.general_response || '';
                    document.getElementById('user-rule').value = settings.user_rule || '';
                } else {
                    userSettingsDisplay.textContent = data.message || 'Nema sačuvanih podešavanja za ovog korisnika.';
                    // Očisti formu
                    document.getElementById('discord-token').value = '';
                    document.getElementById('is-checkbox-checked').checked = false;
                    document.getElementById('general-response').value = '';
                    document.getElementById('user-rule').value = '';
                }
                logResponse("Korisnička podešavanja uspešno dohvaćena.", 'success');
            } else if (data) {
                userSettingsDisplay.textContent = data.message || 'Nema korisničkih podešavanja za prikaz.';
            }
        }

        // Inicijalizuj UI prilikom učitavanja stranice
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
