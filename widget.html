<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitaj Botanicu - Chat Widget</title>
    <style>
        #qaPopup {
            position: fixed; bottom: 20px; right: 20px;
            width: 100%; max-width: 400px;
            border-radius: 10px; background: #f9f9f9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ccc; display: flex; flex-direction: column;
            z-index: 1006; overflow: hidden;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            font-family: Arial, sans-serif;
        }
        #qaPopup.active {
            transform: translateY(0);
            opacity: 1;
        }
        #chatHistory {
            padding: 10px; max-height: 50vh; overflow-y: auto; font-size: 0.95em;
            background-color: #fff;
        }
        .chat-message { margin-bottom: 10px; word-wrap: break-word; }
        .chat-message.user { text-align: right; color: #007BFF; }
        .chat-message.bot { text-align: left; color: #333333; white-space: pre-wrap; }
        #qaPopup textarea {
            padding:10px; width: calc(100% - 20px); font-size:1em;
            margin:10px; display:block; resize:none; min-height:40px; overflow:hidden; box-sizing:border-box;
        }
        #chatControls {
            display: flex; justify-content: flex-end; gap: 10px; margin: 0 10px 10px 10px;
        }
        #chatControls button {
            padding:10px 15px; font-size:1em; cursor:pointer; border-radius: 5px; border: none;
        }
        #sendBtn { background-color: #888; color: white; }
        #sendBtn:hover { background-color: #007BFF; }
        #closeChatBtn { background-color: #888; color: white; }
        #closeChatBtn:hover { background-color: #FF0000; }
        #openChatBtn {
            position: fixed; bottom: 20px; right: 20px; z-index:1005;
            padding: 15px 25px; font-size: 1.2em; cursor: pointer;
            border-radius: 50px; border: none; background-color: #888; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #openChatBtn:hover { background-color: #007BFF; }
        #statusMessage {
            font-size: 12px; margin: 5px 10px; display: none; padding: 5px; border-radius: 4px;
        }
        #statusMessage.success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        #statusMessage.error { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
        @media screen and (max-width:768px) {
            #qaPopup { width:90%; right:5%; bottom:10px; max-width:none; }
            #qaPopup textarea { width: calc(100% - 20px); }
        }
    </style>
</head>
<body style="margin:0; padding:0;">

    <button id="openChatBtn">Chat</button>

    <div id="qaPopup">
        <div id="chatHistory"></div>
        <textarea id="userQuestion" placeholder="Postavi pitanje..."></textarea>
        <div id="statusMessage"></div>
        <div id="chatControls">
            <button id="closeChatBtn">Zatvori</button>
            <button id="sendBtn">Pošalji</button>
        </div>
    </div>

    <script>
        let googleUserId = ''; // zadrzavamo postojeću logiku
        const statusMessage = document.getElementById('statusMessage');
        const chatHistory = document.getElementById('chatHistory');
        const userQuestion = document.getElementById('userQuestion');

        // Funkcija za parsiranje URL parametara
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        };

        window.onload = function() {
            googleUserId = getUrlParameter('site');
            if (!googleUserId) {
                statusMessage.textContent = 'Greška: User ID nije pronađen u URL-u.';
                statusMessage.className = 'error';
                statusMessage.style.display = 'block';
            }
        };

        function appendMessage(sender, text) {
            const div = document.createElement("div");
            div.className = `chat-message ${sender}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendQuestion() {
            const question = userQuestion.value.trim();
            if(!question) return;

            appendMessage("user", question);
            userQuestion.value = '';

            statusMessage.style.display = 'none';
            statusMessage.className = '';
            
            if (!googleUserId) {
                appendMessage("bot", "Greška: User ID nije definisan. Proverite embed kod.");
                return;
            }

            try {
                appendMessage("bot", "Učitavanje odgovora...");

                const response = await fetch('https://botanica.ngrok.app/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        google_user_id: googleUserId,
                        question: question
                    }),
                });

                const data = await response.json();
                chatHistory.lastChild.remove(); // ukloni "Učitavanje odgovora..."

                if (data.status === 'success') {
                    appendMessage("bot", data.answer);
                    statusMessage.textContent = 'Uspešno primljen odgovor!';
                    statusMessage.className = 'success';
                } else if (data.status === 'not_found') {
                    appendMessage("bot", data.answer);
                    statusMessage.textContent = 'Nije pronađen direktan odgovor.';
                    statusMessage.className = 'error';
                } else {
                    appendMessage("bot", 'Greška: ' + (data.message || 'Nepoznata greška.'));
                    statusMessage.textContent = 'Došlo je do greške prilikom obrade vašeg zahteva.';
                    statusMessage.className = 'error';
                }
                statusMessage.style.display = 'block';

            } catch (error) {
                console.error('Došlo je do greške:', error);
                chatHistory.lastChild.remove();
                appendMessage("bot", 'Došlo je do greške prilikom komunikacije sa serverom.');
                statusMessage.textContent = 'Došlo je do greške prilikom komunikacije sa serverom.';
                statusMessage.className = 'error';
                statusMessage.style.display = 'block';
            }
        }

        // Kontrole widgeta
        const openChatBtn = document.getElementById("openChatBtn");
        const qaPopup = document.getElementById("qaPopup");
        const closeChatBtn = document.getElementById("closeChatBtn");
        const sendBtn = document.getElementById("sendBtn");

        function openChat() {
            qaPopup.classList.add("active");
        }
        function closeChat() {
            qaPopup.classList.remove("active");
        }

        openChatBtn.addEventListener("click", () => {
            if (qaPopup.classList.contains("active")) {
                closeChat();
            } else {
                openChat();
            }
        });

        closeChatBtn.addEventListener("click", closeChat);
        sendBtn.addEventListener("click", sendQuestion);
        userQuestion.addEventListener("keydown", e => {
            if(e.key === "Enter" && !e.shiftKey){
                e.preventDefault();
                sendQuestion();
            }
        });
    </script>

</body>
</html>
