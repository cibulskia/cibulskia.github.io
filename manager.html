<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica - Upravljanje</title>
    <!-- Google Platform Library za prijavu -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Upravljanje Botanicom</h1>

        <div id="g_id_onload"
             data-client_id="252373158568-4up41b7jo8ik6cu8c1pl3mlvvck2sq2t.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="true">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>

        <div id="auth-info" style="display: none;">
            <p>Prijavljeni ste kao: <strong id="user-name"></strong> (<span id="user-email"></span>)</p>
            <p>Vaš Google User ID: <strong id="user-id"></strong></p>
            <button onclick="signOut()">Odjava</button>
        </div>

        <div id="category-section" style="display: none;">
            <h2>Discord Postavke</h2>
            <form id="discord-settings-form">
                <label for="discord_token">Discord Bot Token:</label>
                <input type="text" id="discord_token" placeholder="Unesite Discord bot token">

                <div>
                    <input type="checkbox" id="discord_bot_active">
                    <label for="discord_bot_active" style="display: inline;">Aktiviraj Discord Bota</label>
                </div>
                <button type="submit">Sačuvaj Discord Postavke</button>
            </form>

            <hr>

            <h2>Dodaj/Ažuriraj u Botanicu</h2>
            <form id="category-form">
                <label for="client_email">Email klijenta:</label>
                <input type="email" id="client_email" required readonly>

                <label for="sequence_number">Redni broj (1-99):</label>
                <input type="number" id="sequence_number" min="1" max="99">

                <label for="priority">Prioritet (0-9):</label>
                <input type="number" id="priority" min="0" max="9" required>

                <label for="rule">Pravilo:</label>
                <select id="rule" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>

                <label for="response">Odgovor (Unesi tekst):</label>
                <textarea id="response" rows="5" required></textarea>

                <label for="tags">Tagovi (odvojeni zarezima, npr. tag1, tag2, tag3):</label>
                <input type="text" id="tags" placeholder="tag1, tag2, tag3">

                <button type="submit">Sačuvaj Botanicu</button>
                <button type="button" id="load-category-btn">Učitaj Botanicu</button>
            </form>

            <!-- Novo dugme za embedovanje direktno na stranicu -->
            <button id="embed-widget-btn">Embeduj widget na ovu stranicu</button>

            <!-- Dugme za generisanje widgeta za kopiranje -->
            <button id="generate-widget-btn">Prikaži kod za embedovanje</button>
            <div id="widget-code" style="display: none;"></div>

            <div id="message"></div>

            <div id="categories-list">
                <h2>Vaša Botanica</h2>
                <div id="no-categories" style="display: none;">Nema sačuvanih kategorija za ovog korisnika.</div>
                <div id="categories-container"></div>
            </div>

            <!-- Container gde će se embedovati widget direktno -->
            <div id="embedded-widget-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
