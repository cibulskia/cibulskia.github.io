<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem za Pitanja i Odgovore - Widget</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4; /* Ovo je samo za test, widget obično ide na postojeći body */
        }

        /* Stilovi za dugme koje otvara chat */
        #openChatBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1005;
            padding: 15px 25px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            background-color: #888;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease;
        }
        #openChatBtn:hover {
            background-color: #007BFF;
        }

        /* Stilovi za skočni prozor (widget) */
        #qaPopup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            background: #f9f9f9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            z-index: 1006;
            overflow: hidden;
            transform: translateY(100%); /* Sakrij na početku */
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #qaPopup.active {
            transform: translateY(0); /* Prikaži */
            opacity: 1;
        }

        /* Stilovi za prikaz User ID-a */
        .user-id-display {
            font-size: 0.9em;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
            border-bottom: 1px solid #eee;
            background-color: #e9ecef;
        }

        /* Stilovi za "chat" istoriju (Odgovor servera) */
        #responseArea {
            flex-grow: 1; /* Omogući da zauzme dostupan prostor */
            padding: 10px;
            max-height: 50vh; /* Ograniči visinu */
            overflow-y: auto;
            font-size: 0.95em;
            border: none; /* Ukloni bordere koje textarea ima */
            background-color: #f9f9f9; /* Ista pozadina kao popup */
            resize: none; /* Onemogući resize */
            box-sizing: border-box;
        }

        /* Stilovi za polje za unos pitanja */
        #question {
            padding: 10px;
            width: calc(100% - 20px);
            font-size: 1em;
            margin: 10px;
            display: block;
            resize: none;
            min-height: 40px;
            overflow: hidden;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Kontrole (dugmad) */
        #chatControls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin: 0 10px 10px 10px;
            padding-top: 5px;
            border-top: 1px solid #eee;
        }
        #chatControls button {
            padding: 10px 15px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            transition: background-color 0.3s ease;
        }
        #sendBtn {
            background-color: #007bff; /* Primarna boja za slanje */
            color: white;
        }
        #sendBtn:hover {
            background-color: #0056b3;
        }
        #closeChatBtn {
            background-color: #888;
            color: white;
        }
        #closeChatBtn:hover {
            background-color: #FF0000;
        }

        /* Stilovi za status poruke */
        .status-message {
            margin: 0 10px 10px 10px;
            padding: 8px;
            border-radius: 4px;
            display: none;
            font-size: 0.85em;
            text-align: center;
        }
        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Prilagodljivost za manje ekrane */
        @media screen and (max-width: 768px) {
            #qaPopup {
                width: 90%;
                right: 5%;
                bottom: 10px;
                max-width: none;
            }
            #question {
                width: calc(100% - 20px);
            }
        }
    </style>
</head>
<body>

    <button id="openChatBtn">Pitanja</button>

    <div id="qaPopup">
        <p class="user-id-display" id="displayedUserId"></p>
        <textarea id="responseArea" readonly placeholder="Odgovor servera će se pojaviti ovde..."></textarea>
        <textarea id="question" placeholder="Postavi pitanje..."></textarea>
        <div id="statusMessage" class="status-message"></div>
        <div id="chatControls">
            <button id="closeChatBtn">Zatvori</button>
            <button id="sendBtn">Pošalji</button>
        </div>
    </div>

    <script>
        let googleUserId = ''; // Globalna varijabla za čuvanje User ID-a

        document.addEventListener('DOMContentLoaded', () => {
            const openChatBtn = document.getElementById('openChatBtn');
            const qaPopup = document.getElementById('qaPopup');
            const closeChatBtn = document.getElementById('closeChatBtn');
            const sendBtn = document.getElementById('sendBtn');
            const questionInput = document.getElementById('question');
            const responseArea = document.getElementById('responseArea');
            const statusMessage = document.getElementById('statusMessage');
            const displayedUserId = document.getElementById('displayedUserId');

            // Preuzimanje User ID-a iz URL-a (kao u originalnom kodu)
            const params = new URLSearchParams(window.location.search);
            googleUserId = params.get('site');

            if (googleUserId) {
                displayedUserId.textContent = `Povezan User ID: ${googleUserId}`;
                console.log('Detected User ID from URL:', googleUserId);
            } else {
                displayedUserId.textContent = 'User ID nije pronađen u URL-u.';
                console.warn('User ID not found in URL. Please ensure the "site" parameter is set.');
            }

            // Funkcija za automatsko prilagođavanje visine textarea polja za pitanje
            questionInput.addEventListener('input', e => {
                e.target.style.height = 'auto';
                e.target.style.height = (e.target.scrollHeight) + 'px';
            });

            // Otvaranje/zatvaranje widgeta
            openChatBtn.addEventListener('click', () => {
                qaPopup.classList.toggle('active');
            });

            closeChatBtn.addEventListener('click', () => {
                qaPopup.classList.remove('active');
            });

            // Slanje pitanja (prerađena sendQuestion funkcija)
            sendBtn.addEventListener('click', sendQuestion);
            questionInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendQuestion();
                }
            });

            async function sendQuestion() {
                const question = questionInput.value.trim();

                responseArea.value = 'Učitavanje odgovora...';
                statusMessage.style.display = 'none';
                statusMessage.className = 'status-message'; // Reset class

                if (!googleUserId) {
                    responseArea.value = '';
                    statusMessage.textContent = 'User ID nije dostupan. Molimo proverite URL.';
                    statusMessage.classList.add('error');
                    statusMessage.style.display = 'block';
                    return;
                }

                if (!question) {
                    responseArea.value = '';
                    statusMessage.textContent = 'Molimo unesite pitanje.';
                    statusMessage.classList.add('error');
                    statusMessage.style.display = 'block';
                    return;
                }

                try {
                    const response = await fetch('http://localhost:8080', { // Vaš server URL iz prvog koda
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            google_user_id: googleUserId,
                            question: question
                        }),
                    });

                    const data = await response.json();

                    if (data.status === 'success') {
                        responseArea.value = data.answer;
                        statusMessage.textContent = 'Uspešno primljen odgovor!';
                        statusMessage.classList.add('success');
                    } else if (data.status === 'not_found') {
                        responseArea.value = data.answer;
                        statusMessage.textContent = 'Nije pronađen direktan odgovor, prikazan je podrazumevani.';
                        statusMessage.classList.add('error');
                    } else {
                        responseArea.value = 'Greška: ' + (data.message || 'Nepoznata greška.');
                        statusMessage.textContent = 'Došlo je do greške prilikom obrade vašeg zahteva.';
                        statusMessage.classList.add('error');
                    }
                    statusMessage.style.display = 'block';

                } catch (error) {
                    console.error('Došlo je do greške:', error);
                    responseArea.value = 'Došlo je do greške prilikom komunikacije sa serverom.';
                    statusMessage.textContent = 'Došlo je do greške prilikom komunikacije sa serverom.';
                    statusMessage.classList.add('error');
                    statusMessage.style.display = 'block';
                } finally {
                    // Resetovanje polja za pitanje i visine nakon slanja
                    questionInput.value = '';
                    questionInput.style.height = 'auto';
                }
            }
        });
    </script>
</body>
</html>
