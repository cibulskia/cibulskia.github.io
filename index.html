<!DOCTYPE html>
<html>
<head>
    <title>GitHub Hosted App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #googleLoginButton {
            margin-bottom: 20px;
        }
        #submitButton {
            margin-bottom: 20px;
            padding: 10px 20px;
        }
        #submitButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-row input {
            padding: 5px;
            width: 60px;
        }
    </style>
</head>
<body>
    <!-- Google dugme -->
    <div id="googleLoginButton"></div>

    <!-- Dugme Pošalji -->
    <button id="submitButton" disabled>Pošalji</button>

    <!-- Pet polja u jednom redu -->
    <div class="input-row" id="firstRow">
        <input type="text" placeholder="Polje 1">
        <input type="text" placeholder="Polje 2">
        <input type="text" placeholder="Polje 3">
        <input type="text" placeholder="Polje 4">
        <input type="text" placeholder="Polje 5">
    </div>

    <!-- Sedam redova po 6 polja -->
    <div id="gridRows">
        <!-- Redovi će biti generisani pomoću JS -->
    </div>

    <div id="responseArea"></div>

    <script>
        // Generisanje 7 redova po 6 polja
        const gridContainer = document.getElementById('gridRows');
        for (let i = 0; i < 7; i++) {
            const row = document.createElement('div');
            row.className = 'input-row';
            for (let j = 0; j < 6; j++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = `R${i+1}P${j+1}`;
                row.appendChild(input);
            }
            gridContainer.appendChild(row);
        }

        // Primer aktiviranja dugmeta kada se neko polje popuni
        const allInputs = document.querySelectorAll('input');
        allInputs.forEach(input => {
            input.addEventListener('input', () => {
                const anyFilled = Array.from(allInputs).some(i => i.value.trim() !== '');
                document.getElementById('submitButton').disabled = !anyFilled;
            });
        });
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
