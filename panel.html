<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #0056b3; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        #categoriesList { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .category-item {
            background-color: #e2f0fb;
            border: 1px solid #b3d9ff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .category-item p { margin: 5px 0; }
        .google-sign-in-button {
            display: inline-block;
            background: white;
            color: #444;
            width: 190px;
            border-radius: 5px;
            border: thin solid #888;
            box-shadow: 1px 1px 1px grey;
            white-space: nowrap;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .google-sign-in-button:hover {
            box-shadow: 2px 2px 2px grey;
        }
        .google-sign-in-button img {
            width: 48px;
            height: 48px;
            vertical-align: middle;
        }
        .google-sign-in-button span {
            display: inline-block;
            vertical-align: middle;
            padding-left: 10px;
            padding-right: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Category Management System</h1>

        <div class="section" id="authSection">
            <h2>Google Sign-In</h2>
            <div id="g_id_onload"
                 data-client_id="252373158568-4up41b7jo8ik6cu8c1pl3mlvvck2sq2t.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
            <p id="authStatus"></p>
            <p id="userInfo" style="font-weight: bold;"></p>
            <button id="logoutButton" style="display: none;">Logout</button>
        </div>

        <div class="section" id="categoryFormSection" style="display: none;">
            <h2>Add/Update Category</h2>
            <label for="clientEmail">Client Email:</label>
            <input type="text" id="clientEmail" placeholder="Enter client email (autofilled if logged in)">

            <label for="sequenceNumber">Sequence Number (1-99):</label>
            <input type="number" id="sequenceNumber" min="1" max="99" value="1">

            <label for="priority">Priority (0-9):</label>
            <input type="number" id="priority" min="0" max="9" value="5">

            <label for="rule">Rule (A, B, or C):</label>
            <select id="rule">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>

            <label for="response">Response:</label>
            <textarea id="response" placeholder="Enter response text"></textarea>

            <label for="tags">Tags (comma-separated):</label>
            <input type="text" id="tags" placeholder="e.g., tag1, tag2, tag3">

            <button onclick="addUpdateCategory()">Save Category</button>
            <div id="formMessage" class="message" style="display: none;"></div>
        </div>

        <div class="section" id="getCategoriesSection" style="display: none;">
            <h2>Your Categories</h2>
            <button onclick="fetchCategories()">Refresh Categories</button>
            <div id="categoriesList">
                <p>No categories loaded yet.</p>
            </div>
            <div id="getCategoriesMessage" class="message" style="display: none;"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://botanica.ngrok.app"; // Proveri da li se ovo podudara sa portom tvog servera

        let currentUser = {
            id: null,
            email: null,
            name: null,
            jwt: null // JWT token (credential) za slanje backendu
        };

        // Funkcija za Google prijavu
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            currentUser.jwt = response.credential; // Sačuvaj JWT token

            // Pošalji credential backendu radi verifikacije i dobijanja user informacija
            fetch(`${BACKEND_URL}/oauth_callback`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ credential: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    currentUser.id = data.user_id;
                    currentUser.email = data.user_email;
                    currentUser.name = data.user_name;
                    updateUIForLoggedInUser();
                    showMessage('authStatus', `Logged in as: ${currentUser.name} (${currentUser.email})`, 'success');
                    console.log("Backend verifikacija uspešna:", data);
                } else {
                    showMessage('authStatus', `Login failed: ${data.message}`, 'error');
                    console.error("Backend verifikacija neuspešna:", data);
                }
            })
            .catch(error => {
                console.error('Error during OAuth callback:', error);
                showMessage('authStatus', 'Error communicating with backend for OAuth.', 'error');
            });
        }

        function updateUIForLoggedInUser() {
            document.getElementById('g_id_onload').style.display = 'none';
            document.querySelector('.g_id_signin').style.display = 'none';
            document.getElementById('userInfo').innerText = `Logged in as: ${currentUser.name} (${currentUser.email})`;
            document.getElementById('logoutButton').style.display = 'inline-block';
            document.getElementById('categoryFormSection').style.display = 'block';
            document.getElementById('getCategoriesSection').style.display = 'block';

            // Postavi email u formu ako je dostupan
            if (currentUser.email) {
                document.getElementById('clientEmail').value = currentUser.email;
            }
            fetchCategories(); // Automatski dohvati kategorije nakon prijave
        }

        function logout() {
            currentUser = { id: null, email: null, name: null, jwt: null };
            document.getElementById('g_id_onload').style.display = 'block';
            document.querySelector('.g_id_signin').style.display = 'block';
            document.getElementById('userInfo').innerText = '';
            document.getElementById('authStatus').innerText = '';
            document.getElementById('logoutButton').style.display = 'none';
            document.getElementById('categoryFormSection').style.display = 'none';
            document.getElementById('getCategoriesSection').style.display = 'none';
            document.getElementById('clientEmail').value = ''; // Obriši email iz forme
            document.getElementById('categoriesList').innerHTML = '<p>No categories loaded yet.</p>';

            // Clear Google session (optional, but good practice)
            google.accounts.id.disableAutoSelect(); // Prevents auto-login on next visit
            console.log("Logged out.");
        }

        document.getElementById('logoutButton').addEventListener('click', logout);


        // Funkcija za dodavanje/ažuriranje kategorije
        async function addUpdateCategory() {
            if (!currentUser.id) {
                showMessage('formMessage', 'Please log in first.', 'error');
                return;
            }

            const clientEmail = document.getElementById('clientEmail').value.trim();
            const sequenceNumber = parseInt(document.getElementById('sequenceNumber').value);
            const priority = parseInt(document.getElementById('priority').value);
            const rule = document.getElementById('rule').value;
            const response = document.getElementById('response').value.trim();
            const tagsInput = document.getElementById('tags').value.trim();
            const tags = tagsInput ? tagsInput.split(',').map(tag => tag.trim()) : [];

            const data = {
                google_user_id: currentUser.id,
                client_email: clientEmail,
                sequence_number: sequenceNumber,
                priority: priority,
                rule: rule,
                response: response,
                tags: tags
            };

            try {
                const res = await fetch(`${BACKEND_URL}/categories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Možeš dodati Authorization header ako backend zahteva, npr:
                        // 'Authorization': `Bearer ${currentUser.jwt}`
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.status === 'success') {
                    showMessage('formMessage', result.message, 'success');
                    fetchCategories(); // Osveži listu kategorija
                } else {
                    showMessage('formMessage', `Error: ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('Error adding/updating category:', error);
                showMessage('formMessage', 'An error occurred while saving the category.', 'error');
            }
        }

        // Funkcija za dohvatanje kategorija
        async function fetchCategories() {
            if (!currentUser.id) {
                showMessage('getCategoriesMessage', 'Please log in to view categories.', 'error');
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/get_categories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // 'Authorization': `Bearer ${currentUser.jwt}`
                    },
                    body: JSON.stringify({ google_user_id: currentUser.id })
                });
                const result = await res.json();

                const categoriesListDiv = document.getElementById('categoriesList');
                categoriesListDiv.innerHTML = ''; // Očisti prethodne kategorije

                if (result.status === 'success' && result.categories.length > 0) {
                    result.categories.forEach(cat => {
                        const div = document.createElement('div');
                        div.className = 'category-item';
                        div.innerHTML = `
                            <p><strong>Client Email:</strong> ${cat.client_email}</p>
                            <p><strong>Sequence:</strong> ${cat.sequence_number}</p>
                            <p><strong>Priority:</strong> ${cat.priority}</p>
                            <p><strong>Rule:</strong> ${cat.rule}</p>
                            <p><strong>Response:</strong> ${cat.response}</p>
                            <p><strong>Tags:</strong> ${cat.tags.join(', ')}</p>
                        `;
                        categoriesListDiv.appendChild(div);
                    });
                    showMessage('getCategoriesMessage', `Loaded ${result.categories.length} categories.`, 'success');
                } else if (result.status === 'success' && result.categories.length === 0) {
                    categoriesListDiv.innerHTML = '<p>No categories found for this user.</p>';
                    showMessage('getCategoriesMessage', 'No categories found.', 'info');
                } else {
                    showMessage('getCategoriesMessage', `Error: ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('Error fetching categories:', error);
                showMessage('getCategoriesMessage', 'An error occurred while fetching categories.', 'error');
            }
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerText = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000); // Poruka nestaje posle 5 sekundi
        }

        // Initial check if user is already logged in (e.g., if Google One Tap is active)
        window.onload = function() {
            // This part is mostly handled by Google Identity Services directly now.
            // If the user has a valid session from a previous visit, the `handleCredentialResponse`
            // will be called automatically (if data-auto_select is true).
            // For manual sign-in, the user clicks the button.
        };
    </script>
</body>
</html>
